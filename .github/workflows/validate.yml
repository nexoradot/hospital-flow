name: Validate Hospital Flow
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check patient.js
      - name: Check required app files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s config.js
          test -s patient.html
          test -s patient.js
          test -s supabase/migrations/202610220013_phase7_verified_patient_portal.sql
          test -s supabase/migrations/202610220014_phase7_private_portal_grants_hardening.sql
          test -s supabase/migrations/202610220015_phase7_public_catalog_invoker_hardening.sql
          grep -q 'get_patient_portal_directory' patient.js
          grep -q 'create_patient_portal_ticket' patient.js
          test -s supabase/migrations/202610220012_phase6_department_service_management.sql
          grep -q 'function renderKiosk' app.js
          grep -q 'create_queue_ticket' app.js
          grep -q 'function renderReports' app.js
          grep -q 'function exportQueueCsv' app.js
          grep -q 'appointment-slot' app.js
          ! grep -qi 'service_role' config.js
